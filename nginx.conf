events { worker_connections 4096; }

http {
  # WebSocket: chi gui "Connection: upgrade" khi client thuc su xin upgrade.
  # Ban cu set cung "upgrade" cho MOI request -> vai proxy/HTTP2 xu ly sai.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api { server api:8000; }

  server {
    listen 80;
    # upload file audio/docx -> mac dinh 1MB la qua nho
    client_max_body_size 64m;

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Phien dich chay hang gio lien tuc: mac dinh 60s se dut WS giua chung.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      # Khong dem buffer -> caption/audio di ngay, khong bi tre
      proxy_buffering off;
    }
  }
}
